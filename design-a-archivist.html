<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Encounter Composer — Design A: Archivist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#1a1a2e;--card:#16213e;--pl:#CE93D8;--purple:#7B1FA2;--border:#0f3460;--gray:#8892a4;--text:#f0f0f0;--blue:#64b5f6;--green:#4CAF50;--used:#e57373;}
*{box-sizing:border-box;}
body{margin:0;background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(123,31,162,.12) 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(100,181,246,.08) 0%,transparent 50%);}
header{padding:28px 32px 18px;text-align:center;}
header h1{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--pl);margin:0 0 8px;letter-spacing:1px;}
header p{color:var(--gray);font-size:12px;margin:0;}
#app{display:flex;gap:20px;max-width:1180px;margin:0 auto;padding:0 24px 60px;align-items:flex-start;}
#route-panel{width:260px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4);}
#route-search{width:100%;background:#0d1117;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;padding:12px 16px;outline:none;}
#route-search::placeholder{color:var(--gray);}
#route-list{max-height:640px;overflow-y:auto;}
.route-item{padding:10px 16px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03);transition:all .15s;color:var(--text);}
.route-item:hover{background:rgba(206,147,216,.08);}
.route-item.active{background:rgba(206,147,216,.15);border-left:3px solid var(--pl);color:var(--pl);font-weight:700;padding-left:13px;}
.route-item .rcount{float:right;font-size:10px;color:var(--green);font-family:'Press Start 2P',monospace;}
#slot-panel{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 28px;min-height:640px;box-shadow:0 8px 30px rgba(0,0,0,.4);}
#route-title{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--blue);margin-bottom:4px;}
#route-sub{color:var(--gray);font-size:11px;margin-bottom:20px;}
#slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.slot{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;position:relative;min-height:78px;display:flex;flex-direction:column;justify-content:center;}
.slot:hover{border-color:var(--blue);transform:translateY(-2px);}
.slot.filled{background:rgba(76,175,80,.06);border-color:rgba(76,175,80,.35);}
.slot-idx{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gray);margin-bottom:6px;}
.slot-rate{position:absolute;top:10px;right:12px;font-size:9px;color:var(--green);font-family:'Press Start 2P',monospace;}
.slot-empty{color:var(--gray);font-size:12px;font-style:italic;}
.slot-mon{font-size:14px;font-weight:700;color:var(--text);}
.slot-clear{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--gray);cursor:pointer;opacity:.6;}
.slot-clear:hover{color:var(--used);opacity:1;}
#empty-state{color:var(--gray);font-size:13px;text-align:center;padding:80px 20px;}
#picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;}
#picker-overlay.hidden{display:none;}
#picker-box{width:min(520px,90vw);max-height:78vh;background:#0d1b2a;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;}
#picker-hdr{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);background:rgba(206,147,216,.06);}
#picker-hdr b{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--pl);flex:1;}
#picker-search{flex-shrink:0;background:#0d1117;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 12px;outline:none;margin:12px 18px 0;}
#picker-close{background:none;border:none;color:var(--gray);font-size:16px;cursor:pointer;}
#picker-list{overflow-y:auto;padding:14px 18px 18px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.pool-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;font-size:13px;transition:all .15s;}
.pool-item:hover{border-color:var(--pl);background:rgba(206,147,216,.08);}
.pool-item.used{opacity:.4;}
.pool-item.used:hover{opacity:.7;}
.pool-item .tag{font-size:8px;color:var(--used);font-family:'Press Start 2P',monospace;white-space:nowrap;}
#legend{max-width:1180px;margin:0 auto 20px;padding:0 24px;color:var(--gray);font-size:11px;text-align:center;}
#legend b{color:var(--pl);}
</style>
</head>
<body>
<header>
  <h1>🌿 ENCOUNTER COMPOSER</h1>
  <p>Design A — angelehnt an den bestehenden Wild Encounter Browser</p>
</header>
<div id="legend">Route wählen → Slot anklicken → Pokémon aus dem Pool zuweisen. Bereits <b>global</b> verwendete Pokémon erscheinen ausgegraut.</div>
<div id="app">
  <div id="route-panel">
    <input id="route-search" placeholder="Route suchen…">
    <div id="route-list"></div>
  </div>
  <div id="slot-panel">
    <div id="slot-content">
      <div id="empty-state">← Wähle links eine Route, um ihre Encounter Slots zu befüllen.</div>
    </div>
  </div>
</div>

<div id="picker-overlay" class="hidden">
  <div id="picker-box">
    <div id="picker-hdr"><b>SLOT WÄHLEN</b><button id="picker-close">✕</button></div>
    <input id="picker-search" placeholder="Pokémon suchen…">
    <div id="picker-list"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const RATES=[15,10,10,10,10,10,10,5,5,5,5,5];
let assignments={}; // routeKey -> array(12) of speciesKey|null
let currentRoute=null, currentSlot=null;

function usageMap(){
  const m=new Map();
  for(const [rkey,slots] of Object.entries(assignments)){
    slots.forEach((sp,i)=>{
      if(!sp) return;
      const rname=ROUTES.find(r=>r.key===rkey)?.name||rkey;
      if(!m.has(sp)) m.set(sp,[]);
      m.get(sp).push({route:rname,slot:i+1});
    });
  }
  return m;
}
function routeFillCount(rkey){
  const slots=assignments[rkey];
  if(!slots) return 0;
  return slots.filter(Boolean).length;
}
function renderRoutes(filter=''){
  const list=document.getElementById('route-list');
  list.innerHTML='';
  ROUTES.filter(r=>r.name.toLowerCase().includes(filter.toLowerCase())).forEach(r=>{
    const el=document.createElement('div');
    el.className='route-item'+(r.key===currentRoute?' active':'');
    const cnt=routeFillCount(r.key);
    el.innerHTML=`${r.name}<span class="rcount">${cnt?cnt+'/12':''}</span>`;
    el.addEventListener('click',()=>{currentRoute=r.key;renderRoutes(document.getElementById('route-search').value);renderSlots();});
    list.appendChild(el);
  });
}
function renderSlots(){
  const wrap=document.getElementById('slot-content');
  if(!currentRoute){wrap.innerHTML='<div id="empty-state">← Wähle links eine Route, um ihre Encounter Slots zu befüllen.</div>';return;}
  if(!assignments[currentRoute]) assignments[currentRoute]=Array(12).fill(null);
  const rname=ROUTES.find(r=>r.key===currentRoute).name;
  const slots=assignments[currentRoute];
  wrap.innerHTML=`<div id="route-title">${rname}</div><div id="route-sub">Land Encounters — 12 Slots</div><div id="slot-grid"></div>`;
  const grid=wrap.querySelector('#slot-grid');
  slots.forEach((sp,i)=>{
    const el=document.createElement('div');
    el.className='slot'+(sp?' filled':'');
    const mon=sp?POOL.find(p=>p.key===sp):null;
    el.innerHTML=`<div class="slot-idx">SLOT ${i+1}</div><div class="slot-rate">${RATES[i]}%</div>`+
      (mon?`<div class="slot-mon">${mon.name}</div><div class="slot-clear" title="Slot leeren">✕ leeren</div>`:`<div class="slot-empty">+ Pokémon wählen</div>`);
    el.addEventListener('click',(e)=>{
      if(e.target.classList.contains('slot-clear')){slots[i]=null;renderSlots();renderRoutes(document.getElementById('route-search').value);return;}
      openPicker(i);
    });
    grid.appendChild(el);
  });
}
function openPicker(slotIdx){
  currentSlot=slotIdx;
  document.getElementById('picker-overlay').classList.remove('hidden');
  document.getElementById('picker-search').value='';
  renderPicker('');
  document.getElementById('picker-search').focus();
}
function renderPicker(filter){
  const usage=usageMap();
  const list=document.getElementById('picker-list');
  list.innerHTML='';
  POOL.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).slice(0,200).forEach(p=>{
    const used=usage.get(p.key);
    const el=document.createElement('div');
    el.className='pool-item'+(used?' used':'');
    el.innerHTML=`<span>${p.name}</span>`+(used?`<span class="tag">${used[0].route}${used.length>1?' +'+(used.length-1):''}</span>`:'');
    el.addEventListener('click',()=>{
      assignments[currentRoute][currentSlot]=p.key;
      document.getElementById('picker-overlay').classList.add('hidden');
      renderSlots();renderRoutes(document.getElementById('route-search').value);
    });
    list.appendChild(el);
  });
}
document.getElementById('route-search').addEventListener('input',e=>renderRoutes(e.target.value));
document.getElementById('picker-search').addEventListener('input',e=>renderPicker(e.target.value));
document.getElementById('picker-close').addEventListener('click',()=>document.getElementById('picker-overlay').classList.add('hidden'));
document.getElementById('picker-overlay').addEventListener('click',e=>{if(e.target.id==='picker-overlay')e.target.classList.add('hidden');});
renderRoutes();
</script>
</body>
</html>
